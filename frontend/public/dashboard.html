<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - CES 스마트팜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        * {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">
    <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                        <span class="text-2xl">🌱</span>
                    </div>
                    <h1 class="text-2xl font-bold">CES 스마트팜 시스템</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userEmail" class="text-sm">로딩 중...</span>
                    <button onclick="auth.logout()"
                        class="px-4 py-2 bg-white bg-opacity-20 rounded-lg hover:bg-opacity-30 transition">
                        로그아웃
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">대시보드</h2>
            <p class="text-gray-600">모듈을 관리하고 센서 데이터를 확인하세요</p>
        </div>

        <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-semibold text-gray-700">모듈 목록</h3>
                <button onclick="showAddModuleModal()"
                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                    + 모듈 추가
                </button>
            </div>
            <div id="modulesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="text-center py-8 text-gray-500">
                    로딩 중...
                </div>
            </div>
        </div>
    </main>

    <div id="addModuleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold mb-4">모듈 추가</h3>
            <form id="addModuleForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">모듈 이름</label>
                    <input type="text" id="moduleName" required
                        class="w-full py-2 px-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2">MAC 주소</label>
                    <input type="text" id="moduleMac" required placeholder="AA:BB:CC:DD:EE:FF"
                        class="w-full py-2 px-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex space-x-4">
                    <button type="submit"
                        class="flex-1 bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                        추가
                    </button>
                    <button type="button" onclick="hideAddModuleModal()"
                        class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400 transition">
                        취소
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!auth.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        async function loadUserInfo() {
            try {
                const user = await authAPI.getMe();
                document.getElementById('userEmail').textContent = user.email || '사용자';
            } catch (err) {
                console.error('사용자 정보 로드 실패:', err);
            }
        }

        async function loadModules() {
            const modulesList = document.getElementById('modulesList');
            modulesList.innerHTML = '<div class="text-center py-8 text-gray-500">로딩 중...</div>';

            try {
                const response = await modulesAPI.getAll();
                const modules = response.modules || [];

                if (modules.length === 0) {
                    modulesList.innerHTML = `
                        <div class="col-span-full text-center py-12 text-gray-500">
                            <div class="text-4xl mb-4">📦</div>
                            <p>등록된 모듈이 없습니다.</p>
                            <p class="text-sm mt-2">모듈을 추가하여 시작하세요.</p>
                        </div>
                    `;
                    return;
                }

                modulesList.innerHTML = modules.map(module => `
                    <div class="bg-white rounded-xl p-6 shadow-md hover:shadow-lg transition border-2 border-gray-200">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="text-xl font-bold text-gray-800">${module.name}</h4>
                            <button onclick="deleteModule(${module.id})" class="text-red-500 hover:text-red-700">
                                삭제
                            </button>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">MAC: ${module.macAddress}</p>
                        <a href="module.html?id=${module.id}" class="block mt-4 text-center bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                            상세 보기
                        </a>
                    </div>
                `).join('');
            } catch (err) {
                modulesList.innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <p>모듈 목록을 불러오는데 실패했습니다.</p>
                    </div>
                `;
            }
        }

        function showAddModuleModal() {
            document.getElementById('addModuleModal').classList.remove('hidden');
        }

        function hideAddModuleModal() {
            document.getElementById('addModuleModal').classList.add('hidden');
            document.getElementById('addModuleForm').reset();
        }

        document.getElementById('addModuleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('moduleName').value;
            const macAddress = document.getElementById('moduleMac').value;

            try {
                await modulesAPI.create(name, macAddress);
                hideAddModuleModal();
                loadModules();
            } catch (err) {
                alert(err.response?.data?.message || '모듈 추가에 실패했습니다.');
            }
        });

        async function deleteModule(id) {
            if (!confirm('정말 이 모듈을 삭제하시겠습니까?')) return;

            try {
                await modulesAPI.delete(id);
                loadModules();
            } catch (err) {
                alert(err.response?.data?.message || '모듈 삭제에 실패했습니다.');
            }
        }

        loadUserInfo();
        loadModules();
    </script>
</body>

</html>
