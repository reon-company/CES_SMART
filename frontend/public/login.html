<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - CES 스마트팜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        * {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full mx-auto bg-white rounded-xl shadow-xl p-8 border-2 border-gray-200">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🌱</div>
            <h2 class="text-3xl font-bold text-gray-900 mb-2">로그인</h2>
            <p class="text-gray-600">CES 스마트팜 시스템에 접속하세요</p>
        </div>
        
        <div id="errorMessage" class="hidden bg-red-50 border-2 border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 flex items-center space-x-2">
            <span class="text-xl">⚠️</span>
            <span id="errorText"></span>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">
                    이메일
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="your@email.com"
                    class="w-full py-3 px-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                />
            </div>

            <div>
                <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">
                    비밀번호
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="••••••••"
                    class="w-full py-3 px-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                />
            </div>

            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-md hover:shadow-lg"
            >
                로그인
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                계정이 없으신가요?{' '}
                <a href="register.html" class="text-blue-500 hover:text-blue-700 font-semibold">
                    회원가입
                </a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 이미 로그인된 경우 대시보드로 리다이렉트
        if (auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const submitBtn = document.getElementById('submitBtn');

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <span class="flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    로그인 중...
                </span>
            `;

            try {
                const response = await authAPI.login(formData.email, formData.password);
                if (response.success) {
                    auth.setToken(response.token);
                    window.location.href = 'dashboard.html';
                } else {
                    showError(response.message || '로그인에 실패했습니다.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '로그인';
                }
            } catch (err) {
                console.error('Login error:', err);
                let message = '로그인에 실패했습니다.';
                
                if (err.response) {
                    if (err.response.status === 0) {
                        if (err.response.data && err.response.data.message && 
                            err.response.data.message.includes('HTTPS')) {
                            message = err.response.data.message;
                            // HTTPS 설정 안내 페이지로 이동 옵션 제공
                            setTimeout(() => {
                                if (confirm('HTTPS 설정이 필요합니다. 안내 페이지를 보시겠습니까?')) {
                                    window.open('HTTPS_NOTICE.html', '_blank');
                                }
                            }, 100);
                        } else {
                            message = '서버에 연결할 수 없습니다. 네트워크 연결을 확인하세요.';
                        }
                    } else if (err.response.data && err.response.data.message) {
                        message = err.response.data.message;
                    } else if (err.response.status === 401) {
                        message = '이메일 또는 비밀번호가 올바르지 않습니다.';
                    } else if (err.response.status === 500) {
                        message = '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
                    }
                } else if (err.message) {
                    message = err.message;
                }
                
                showError(message);
                submitBtn.disabled = false;
                submitBtn.textContent = '로그인';
            }
        });
    </script>
</body>
</html>
